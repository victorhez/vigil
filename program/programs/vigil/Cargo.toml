[package]
name = "vigil"
version = "0.1.0"
description = "Proof-of-life vault: check in on a schedule, or your assets go to your heirs."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "vigil"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022", "associated_token"] }
