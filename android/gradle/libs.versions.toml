[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
navigation = "2.10.2"
splashscreen = "1.2.0"
biometric = "1.1.0"
glance = "1.2.0"
work = "2.12.0"
fragment = "1.9.1"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
bouncycastle = "1.86"
